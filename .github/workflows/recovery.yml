name: NeighborNet recovery checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ngNeighborNet/package-lock.json
      - name: Test with H2 and build the executable WAR
        working-directory: NeighborNet
        run: bash gradlew --no-daemon --max-workers=2 :test :bootWar
      - name: Run focused frontend tests
        working-directory: ngNeighborNet
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:smoke
      - name: Check packaged frontend assets
        run: python3 scripts/verify-war.py
