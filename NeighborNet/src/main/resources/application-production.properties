# Serve behind an HTTPS reverse proxy; never expose Basic authentication over HTTP.
server.address=127.0.0.1
server.port=8088
server.servlet.context-path=/NeighborNet
server.forward-headers-strategy=framework
spring.datasource.url=${NEIGHBORNET_DB_URL:jdbc:mysql://localhost:3306/neighbornetdb}
spring.datasource.username=${NEIGHBORNET_DB_USER:eventuser}
spring.datasource.password=${NEIGHBORNET_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
