# Isolated tests must never connect to the deployed MySQL database.
spring.datasource.url=jdbc:h2:mem:neighbornet_test;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
