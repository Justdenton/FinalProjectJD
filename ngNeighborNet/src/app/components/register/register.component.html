
<div class="container-md">
  <h1>Register your account</h1>
  <form (ngSubmit)="register(newUser)">
    <div class="form-group row">
      <input type="text" name="email" placeholder="Email" [(ngModel)]="newUser.email">
    </div>

    <div class="form-group row">
      <input type="text" name="userName" placeholder="Username" [(ngModel)]="newUser.username">
    </div>

    <div class="form-group row">
      <input type="password" autocomplete="new-password" name="password" placeholder="Password" [(ngModel)]="newUser.password">
    </div>

    <div class="form-group row">
      <input type="text" name="firstName" placeholder="First Name" [(ngModel)]="newUser.firstName">
    </div>

    <div class="form-group row">
      <input type="text" name="lastName" placeholder="Last Name" [(ngModel)]="newUser.lastName">
    </div>

    <div class="form-group row">
      <input type="text" name="imageUrl" placeholder="Profile Image" [(ngModel)]="newUser.imageUrl">
    </div>

    <br>

    <div class="form-group row">
      <input type="text" name="locationName" placeholder="Name of Location" [(ngModel)]="newUser.address.name"><br>
    </div>

    <div class="form-group row">
      <input type="text" name="street" placeholder="Street" [(ngModel)]="newUser.address.street">
    </div>

    <div class="form-group row">
      <input type="text" name="city" placeholder="City" [(ngModel)]="newUser.address.city">
    </div>

    <div class="form-group row">
      <input type="text" name="state" placeholder="State" [(ngModel)]="newUser.address.state">
    </div>

    <div class="form-group row">
      <input type="text" name="postalCode" placeholder="Postal Code" [(ngModel)]="newUser.address.postalCode">
    </div>

    <div class="form-group row">
      <input type="text" name="country" placeholder="Country" [(ngModel)]="newUser.address.country">
    </div>

  <br>

  <p role="alert">{{ errorMessage }}</p>
  <button type="submit" class="btn btn-outline-primary ms-2" [disabled]="submitting">Register</button>

</form>

</div>
